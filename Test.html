<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Diagnostic</title>
<style>
  body{background:#0a0e14;color:#eef3f8;font-family:monospace;padding:20px;font-size:15px;line-height:1.5}
  button{background:#e8763a;color:#1a0e07;border:0;border-radius:10px;padding:16px 28px;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:20px}
  pre{background:#121822;border:1px solid #1f2a38;border-radius:10px;padding:16px;white-space:pre-wrap;word-break:break-all}
  h3{color:#e8763a;margin:18px 0 6px}
</style>
</head>
<body>
<button id="run">Run Test</button>
<div id="out"></div>
<script>
function log(title, body){
  var d=document.getElementById('out');
  d.innerHTML += '<h3>'+title+'</h3><pre>'+body+'</pre>';
}

async function runOne(label, payload){
  try{
    var res=await fetch('/api/proline',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    var hdrs={
      status:res.headers.get('x-proline-status'),
      count:res.headers.get('x-proline-count'),
      pages:res.headers.get('x-proline-pages'),
      ratelimited:res.headers.get('x-proline-ratelimited'),
      raw:res.headers.get('x-proline-raw')
    };
    var data=await res.json();
    var arr=Array.isArray(data)?data:[];
    var first=arr.length>0?JSON.stringify(arr[0],null,2).slice(0,800):'(no projects)';
    log(label,
      'SENT BODY:\n'+JSON.stringify(payload,null,2)+
      '\n\nHTTP: '+res.status+
      '\nDiagnostic headers: '+JSON.stringify(hdrs)+
      '\nArray length received: '+arr.length+
      '\n\nFirst project:\n'+first
    );
  }catch(e){
    log(label,'ERROR: '+e.message);
  }
}

document.getElementById('run').addEventListener('click',async function(){
  document.getElementById('out').innerHTML='';
  var afterISO=new Date(2026,0,1).toISOString();
  var beforeISO=new Date().toISOString();
  // Test A: full ISO datetime (exactly what the dashboards now send)
  await runOne('A. full ISO (like dashboard)', {created_after:afterISO, created_before:beforeISO});
  // Test B: no date filter at all
  await runOne('B. no date filter', {});
  // Test C: wide ISO range
  await runOne('C. wide ISO 2024-2027', {created_after:new Date(2024,0,1).toISOString(), created_before:new Date(2027,11,31).toISOString()});
});
</script>
</body>
</html>
