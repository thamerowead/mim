<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProLine Endpoint Probe</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#0f0f0f;color:#e0e0e0;padding:16px;margin:0}
  h2{color:#fff;font-size:17px;margin:18px 0 8px}
  button{background:#e8825a;color:#fff;border:0;padding:14px 22px;border-radius:10px;font-size:16px;font-weight:600;width:100%;margin:10px 0}
  button:active{opacity:.7}
  pre{background:#1a1a1a;padding:12px;border-radius:8px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;overflow-x:auto;border:1px solid #2a2a2a}
  .ok{color:#7ec699;font-weight:700}
  .err{color:#e57373}
</style>
</head>
<body>
<h2>ProLine — Endpoint Probe</h2>
<p style="font-size:13px;color:#9a9a9a">يجرّب endpoints مختلفة بتمهّل، ويطبع أيها يرجّع بيانات + أسماء حقولها. اضغط مرة وحدة.</p>
<button onclick="run()">Run Probe (مرة وحدة)</button>

<h2>السجل</h2>
<pre id="log">—</pre>

<h2>عيّنة من كل endpoint نجح</h2>
<pre id="samples">—</pre>

<script>
// endpoints محتملة فيها معلومات الموظفين / الربط
const ENDPOINTS = [
  '/v1/list/users',
  '/v1/list/team',
  '/v1/list/employees',
  '/v1/list/contacts',
  '/v1/list/assignments',
  '/v1/list/jobs'
];

function getItems(data){
  if(Array.isArray(data)) return data;
  if(!data || typeof data!=='object') return [];
  return data.results||data.data||data.projects||data.users||[];
}

async function run(){
  const log=document.getElementById('log');
  const samples=document.getElementById('samples');
  log.textContent='... جاري الفحص بتمهّل (يمكن ياخذ شوي)';
  samples.textContent='';
  let logText=''; let sampleText='';

  for(let i=0;i<ENDPOINTS.length;i++){
    const ep=ENDPOINTS[i];
    try{
      const r=await fetch('/api/proline',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ endpoint:ep, page:1, limit:5 })
      });
      const text=await r.text();
      let data; try{ data=JSON.parse(text); }catch(e){ data=null; }
      const items=getItems(data);

      if(r.status===429 || (data && JSON.stringify(data).includes('429'))){
        logText+=(i+1)+'. '+ep+' → ⚠️ 429 (وقفنا هنا)\n';
        log.textContent=logText; break;
      }

      logText+=(i+1)+'. '+ep+' → HTTP '+r.status+' | count '+items.length+
               (items.length?'  ✅':'')+'\n';
      log.textContent=logText;

      if(items.length>0){
        sampleText+='===== '+ep+' =====\n';
        sampleText+='الحقول: '+Object.keys(items[0]).join(', ')+'\n\n';
        sampleText+='أول عنصر:\n'+JSON.stringify(items[0],null,2)+'\n\n';
        samples.textContent=sampleText;
      }
      await new Promise(res=>setTimeout(res,1200)); // تمهّل عشان نتجنب 429
    }catch(err){
      logText+=(i+1)+'. '+ep+' → خطأ: '+err.message+'\n';
      log.textContent=logText;
    }
  }
  if(!sampleText) samples.innerHTML='<span class="err">ما رجع بيانات من أي endpoint. الأرجح مو متاحة عبر الـ API.</span>';
  logText+='\nخلص الفحص.';
  log.textContent=logText;
}
</script>
</body>
</html>
